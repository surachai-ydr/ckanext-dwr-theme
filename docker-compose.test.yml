# Run the test suite in Docker without a local CKAN install
# (mirrors .github/workflows/test.yml):
#
#   docker compose -f docker-compose.test.yml run --rm ckan
#   docker compose -f docker-compose.test.yml down
#
# Extra arguments are passed to pytest, e.g.:
#
#   docker compose -f docker-compose.test.yml run --rm ckan ckanext/dwr_theme/tests/test_helpers.py -k primary
services:
  ckan:
    image: ckan/ckan-dev:2.10
    user: root
    working_dir: /srv/app/src_extensions/ckanext-dwr-theme
    volumes:
      - .:/srv/app/src_extensions/ckanext-dwr-theme
    environment:
      CKAN_SQLALCHEMY_URL: postgresql://ckan_default:pass@postgres/ckan_test
      CKAN_DATASTORE_WRITE_URL: postgresql://datastore_write:pass@postgres/datastore_test
      CKAN_DATASTORE_READ_URL: postgresql://datastore_read:pass@postgres/datastore_test
      CKAN_SOLR_URL: http://solr:8983/solr/ckan
      CKAN_REDIS_URL: redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      solr:
        condition: service_started
      redis:
        condition: service_started
    entrypoint:
      - bash
      - -c
      - |
        set -e
        pip install -q -r requirements.txt -r dev-requirements.txt
        pip install -q -e .
        # Point a copy of test.ini at CKAN's test-core.ini inside the image
        sed 's#use = config:.*#use = config:/srv/app/src/ckan/test-core.ini#' test.ini > /tmp/test.ini
        ckan -c /tmp/test.ini db init
        if [ $$# -eq 0 ]; then set -- ckanext/dwr_theme; fi
        pytest --ckan-ini=/tmp/test.ini --disable-warnings "$$@"
      - run-tests
    command: []

  solr:
    image: ckan/ckan-solr:2.10-solr9

  redis:
    image: redis:7

  postgres:
    image: ckan/ckan-postgres-dev:2.10
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
