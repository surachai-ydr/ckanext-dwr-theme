{# Inline SVG icons (stroke style). Usage:
     {% import 'dwr_theme/macros/icons.html' as icons %}
     {{ icons.icon('search') }}
#}
{% macro icon(name, class_='dwr-icon') -%}
<svg class="{{ class_ }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
  {%- if name == 'droplet' -%}
    <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/>
  {%- elif name == 'search' -%}
    <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
  {%- elif name == 'database' -%}
    <ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/>
  {%- elif name == 'briefcase' -%}
    <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
  {%- elif name == 'layers' -%}
    <polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/>
  {%- elif name == 'arrow-right' -%}
    <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
  {%- elif name == 'code' -%}
    <polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>
  {%- elif name == 'clock' -%}
    <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
  {%- elif name == 'chevron-down' -%}
    <polyline points="6 9 12 15 18 9"/>
  {%- endif -%}
</svg>
{%- endmacro %}
