version: 1
groups:
  - annotation: ckanext-dwr-theme
    options:
      - key: ckanext.dwr_theme.greeting
        default: Hello
        description: Greeting prefix used by the dwr_theme_hello action and helpers.
        example: Sawasdee
      - key: ckanext.dwr_theme.show_dataset_count
        type: bool
        default: true
        description: Show the total dataset count on the /dwr-theme page.

  - annotation: ckanext-dwr-theme look and feel
    options:
      - key: ckanext.dwr_theme.primary_color
        default: "#0a5cc2"
        description: |
          Brand colour as a hex value (#rgb or #rrggbb). Darker and lighter
          shades are derived from it automatically.
        example: "#00796b"
      - key: ckanext.dwr_theme.hero_title
        description: Homepage hero heading. Defaults to the site title.
        example: DWR Open Data
      - key: ckanext.dwr_theme.hero_subtitle
        description: Homepage hero text. Defaults to the site description.
      - key: ckanext.dwr_theme.hero_image
        description: Optional background image URL for the homepage hero.
        example: /images/hero.jpg
      - key: ckanext.dwr_theme.home_datasets
        type: int
        default: 6
        description: Number of recently updated datasets shown on the homepage.
      - key: ckanext.dwr_theme.home_organizations
        type: int
        default: 8
        description: Number of organizations shown on the homepage.
      - key: ckanext.dwr_theme.web_fonts
        type: bool
        default: true
        description: |
          Load Inter and Noto Sans Thai from Google Fonts. Disable on servers
          without internet access (system fonts are used instead).
