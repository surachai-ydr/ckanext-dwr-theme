version: 1
groups:
  - annotation: ckanext-dwr-theme
    options:
      - key: ckanext.dwr_theme.greeting
        default: Hello
        description: Greeting prefix used by the dwr_theme_hello action and helpers.
        example: Sawasdee
      - key: ckanext.dwr_theme.show_dataset_count
        type: bool
        default: true
        description: Show the total dataset count on the /dwr-theme page.

  - annotation: ckanext-dwr-theme look and feel
    options:
      - key: ckanext.dwr_theme.primary_color
        default: "#0a5cc2"
        description: |
          Brand colour as a hex value (#rgb or #rrggbb). Darker and lighter
          shades are derived from it automatically.
        example: "#00796b"
      - key: ckanext.dwr_theme.hero_title
        description: Homepage hero heading. Defaults to the site title.
        example: DWR Open Data
      - key: ckanext.dwr_theme.hero_subtitle
        description: Homepage hero text. Defaults to the site description.
      - key: ckanext.dwr_theme.hero_image
        description: Optional background image URL for the homepage hero.
        example: /images/hero.jpg
      - key: ckanext.dwr_theme.home_datasets
        type: int
        default: 6
        description: Number of recently updated datasets shown on the homepage.
      - key: ckanext.dwr_theme.home_organizations
        type: int
        default: 8
        description: Number of organizations shown on the homepage.
      - key: ckanext.dwr_theme.web_fonts
        type: bool
        default: true
        description: |
          Load Inter and Noto Sans Thai from Google Fonts. Disable on servers
          without internet access (system fonts are used instead).

  - annotation: ckanext-dwr-theme privacy policy
    options:
      - key: ckanext.dwr_theme.privacy_policy_url
        description: |
          Link the footer's "Privacy Policy" to this URL instead of the built-in
          /privacy-policy page (e.g. an existing policy on the agency website).
        example: https://www.dwr.go.th/privacy-policy

  - annotation: ckanext-dwr-theme homepage modal
    options:
      - key: ckanext.dwr_theme.home_modal
        type: bool
        default: false
        description: |
          Show a welcome/announcement dialog when the homepage is opened. It is
          shown once per browser session; visitors can tick "Don't show this
          again", which lasts until the dialog's content changes.
      - key: ckanext.dwr_theme.home_modal_title
        description: Dialog heading. Defaults to a translated welcome message.
        example: ประกาศ
      - key: ckanext.dwr_theme.home_modal_text
        description: Dialog body as Markdown. Defaults to a translated introduction.
      - key: ckanext.dwr_theme.home_modal_image
        description: Optional image URL shown at the top of the dialog.
        example: /images/announcement.jpg
      - key: ckanext.dwr_theme.home_modal_link_url
        description: Optional URL for a call-to-action button in the dialog.
        example: /dataset
      - key: ckanext.dwr_theme.home_modal_link_text
        description: Label of the call-to-action button.
        example: Browse datasets
