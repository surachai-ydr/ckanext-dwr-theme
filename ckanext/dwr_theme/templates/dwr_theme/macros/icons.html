{# Inline SVG icons (stroke style). Usage:
     {% import 'dwr_theme/macros/icons.html' as icons %}
     {{ icons.icon('search') }}
#}
{% macro icon(name, class_='dwr-icon') -%}
<svg class="{{ class_ }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
  {%- if name == 'droplet' -%}
    <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/>
  {%- elif name == 'search' -%}
    <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
  {%- elif name == 'database' -%}
    <ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/>
  {%- elif name == 'briefcase' -%}
    <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
  {%- elif name == 'layers' -%}
    <polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/>
  {%- elif name == 'arrow-right' -%}
    <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
  {%- elif name == 'code' -%}
    <polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>
  {%- elif name == 'clock' -%}
    <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
  {%- elif name == 'chevron-down' -%}
    <polyline points="6 9 12 15 18 9"/>
  {%- elif name == 'map-pin' -%}
    <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>
  {%- elif name == 'phone' -%}
    <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
  {%- elif name == 'mail' -%}
    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>
  {%- elif name == 'eye' -%}
    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
  {%- elif name == 'lock' -%}
    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
  {%- endif -%}
</svg>
{%- endmacro %}
